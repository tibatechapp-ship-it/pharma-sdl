name: Build Desktop Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # فشل نظام واحد لا يجب أن يلغي بناء بقية الأنظمة.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # لا يوجد package-lock.json في desktop-build، وطلب cache لملف غائب
      # كان يُفشل setup-node فوراً ("Some specified paths were not
      # resolved") فيفشل البناء على كل الأنظمة عند أي وسم إصدار.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop-build
        run: npm install

      - name: Copy project files
        working-directory: desktop-build
        shell: bash
        run: |
          mkdir -p app core static
          cp -f ../app.py app/ || true
          cp -f ../core/*.py core/ || true
          cp -f ../static/*.png static/ || true

      - name: Build
        working-directory: desktop-build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            npm run build:linux
          elif [ "${{ matrix.target }}" = "win" ]; then
            npm run build:win
          else
            npm run build:mac
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pharma-lab-${{ matrix.target }}
          path: desktop-build/dist/*
          retention-days: 30
