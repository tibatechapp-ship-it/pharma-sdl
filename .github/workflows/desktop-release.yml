name: Build Desktop Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # فشل نظام واحد لا يجب أن يلغي بناء بقية الأنظمة.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # لا يوجد package-lock.json في desktop-build، وطلب cache لملف غائب
      # كان يُفشل setup-node فوراً ("Some specified paths were not
      # resolved") فيفشل البناء على كل الأنظمة عند أي وسم إصدار.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop-build
        run: npm install

      - name: Copy project files
        working-directory: desktop-build
        shell: bash
        run: |
          mkdir -p app core static
          cp -f ../app.py app/ || true
          cp -f ../core/*.py core/ || true
          cp -f ../static/*.png static/ || true

      - name: Build
        working-directory: desktop-build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            npm run build:linux
          elif [ "${{ matrix.target }}" = "win" ]; then
            npm run build:win
          else
            npm run build:mac
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pharma-lab-${{ matrix.target }}
          path: desktop-build/dist/*
          retention-days: 30

  # مطلوب حتى لا يبقى الإصدار قشرة فارغة: كانت الحزم تُبنى وتُرفع
  # كـ artifacts مؤقتة (30 يوماً) فقط ولا يصلها أي مسار إلى صفحة
  # الإصدار، فبقيت v0.1.0 بلا أصول بعد أول بناء ناجح. هذه المهمة
  # تجمع حزم الأنظمة الثلاثة من نفس التشغيل وتُلحقها بالإصدار.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List bundles
        run: ls -laR dist

      - name: Attach bundles to the tag release
        uses: softprops/action-gh-release@v2
        with:
          # المستوى الأعلى فقط: الحزم القابلة للتوزيع (.dmg/.exe/.AppImage/
          # .deb/.blockmap وملفات التحديث). النمط التكراري dist/** يلتقط
          # محتويات الحزمة المفككة (آلاف ملفات .pak/.dll) ويسبق الحد
          # الثانوي للمعدل.
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
