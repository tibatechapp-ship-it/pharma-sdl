name: Platform (API-First)

# بوابة الجودة لطبقة المنصة pharma_sdl/ — طبقة التعليم (tests.yml) بقي كما هي.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Ruff + Platform tests + CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff — lint the platform layer
        run: ruff check pharma_sdl tests/test_platform_targets.py tests/test_platform_chemistry.py tests/test_platform_curation.py tests/test_platform_engines.py tests/test_platform_screening.py tests/test_platform_api.py tests/test_platform_cli.py tests/test_platform_validation.py tests/test_platform_experiments.py tests/test_score_lanes.py tests/test_platform_jobs.py tests/test_platform_auth.py tests/test_platform_demo.py tests/test_platform_experiments_api.py tests/test_redocking.py tests/test_platform_pg_stores.py tests/test_platform_loop_api.py tests/test_platform_metrics.py tests/test_platform_campaign_api.py

      - name: Platform unit + API tests
        run: pytest tests/test_platform_targets.py tests/test_platform_chemistry.py tests/test_platform_curation.py tests/test_platform_engines.py tests/test_platform_screening.py tests/test_platform_api.py tests/test_platform_cli.py tests/test_platform_validation.py tests/test_platform_experiments.py tests/test_score_lanes.py tests/test_platform_jobs.py tests/test_platform_auth.py tests/test_platform_demo.py tests/test_platform_experiments_api.py tests/test_platform_pg_stores.py tests/test_platform_loop_api.py tests/test_platform_metrics.py tests/test_platform_campaign_api.py -v --no-cov
        timeout-minutes: 12

      - name: Redocking acceptance — RMSD vs crystal (vina from requirements)
        run: pytest tests/test_redocking.py -v --no-cov
        timeout-minutes: 8

      - name: CLI smoke — engines, targets, tiny screening run
        run: |
          python -m pharma_sdl.cli --version
          python -m pharma_sdl.cli engines
          python -m pharma_sdl.cli targets
          python -m pharma_sdl.cli screen --target 7VH8_A --ligands data/demo_ligands.csv --top 3

      - name: Closed-loop smoke — documented single closed loop in a temp registry
        run: python -m pharma_sdl.cli loop --db /tmp/loop-smoke.sqlite3 --top 3

  docker:
    name: Docker build + health smoke
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pharma-sdl:${{ github.sha }} .

      - name: Health smoke inside the container
        run: |
          docker run -d --name smoke -p 8000:8000 pharma-sdl:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
