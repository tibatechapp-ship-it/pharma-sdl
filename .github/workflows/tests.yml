name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# مبدأ أقل صلاحية (P16): الجناح كله قراءة فقط — الكتابة (contents: write)
# حصراً في job الشارة المنفصل الذي يُشغَّل على push إلى main.
permissions:
  contents: read

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests (coverage over core + scripts + app.py)
        run: pytest -m "not integration" -v --junitxml=/tmp/junit-unit.xml

      - name: Integration tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pytest -m integration -v --no-cov --junitxml=/tmp/junit-int.xml

      - name: Upload test results (input for the badge job)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml
          path: /tmp/junit-*.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  badge:
    name: Dynamic test badge
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    # الكتابة هنا وحدها — ولحصر غرض معلن: تحديث badges/tests.json
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: junit-xml
          path: /tmp/junit

      - name: Compute dynamic test badge (count from real run, not a static claim)
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in sorted(Path("/tmp/junit").glob("junit-*.xml")):
              for s in ET.parse(f).getroot().iter("testsuite"):
                  for k in totals:
                      totals[k] += int(s.get(k, 0))
          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          ok = totals["tests"] > 0 and totals["failures"] == 0 and totals["errors"] == 0
          badge = {
              "schemaVersion": 1,
              "label": "اختبارات",
              "message": f"{passed} ناجح",
              "color": "brightgreen" if ok else "red",
          }
          Path("badges").mkdir(exist_ok=True)
          Path("badges/tests.json").write_text(
              json.dumps(badge, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(badge, ensure_ascii=False))
          PYEOF

      - name: Publish badge (commit back to main, no CI retrigger)
        continue-on-error: true  # فشل نشر الشارة لا يُخضّر/يُحمرّ الجناح — الشارة ليست حكماً على الاختبارات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/tests.json
          if git diff --cached --quiet; then
            echo "badge unchanged — nothing to commit"
          else
            git commit -m "chore(ci): تحديث شارة الاختبارات من التشغيل الفعلي [skip ci]"
            git push
          fi
