# Pharma SDL v0.9.0 — خدمتان من صورة واحدة + PostgreSQL اختياري (P3):
#   api       : بوابة المنصة API-First (FastAPI/Uvicorn) — OpenAPI على /docs
#   dashboard : لوحة Streamlit التعليمية القائمة (تبقى تعمل كما هي)
#   postgres  : خلفية التخزين الحية (P3) — تُفعَّل بملف التعريف "pg" فقط
#
# تشغيل:  docker compose up --build
# مع PostgreSQL الحي (P3):  docker compose --profile pg up --build
# Boltz-2 (اختياري):  PHARMA_SDL_BOLTZ2_ENDPOINT=https://... docker compose up api

services:
  api:
    build: .
    image: pharma-sdl:0.5.0
    ports:
      - "8000:8000"
    environment:
      PHARMA_SDL_ENGINE_FALLBACK: "1"
      PHARMA_SDL_BOLTZ2_ENDPOINT: ${PHARMA_SDL_BOLTZ2_ENDPOINT:-}
      # ── P2: المصادقة ووضع العرض والمهام الدائمة ──
      # مفاتيح API بصيغة id:key:role — فارغ = وضع مفتوح (تطوير فقط! النشر يستوجب مفاتيح)
      PHARMA_SDL_API_KEYS: ${PHARMA_SDL_API_KEYS:-}
      # وضع العرض العام المحدود: حد معدل + قفل محركات + سقوف أدنى
      PHARMA_SDL_DEMO_MODE: ${PHARMA_SDL_DEMO_MODE:-"0"}
      PHARMA_SDL_RATE_LIMIT: ${PHARMA_SDL_RATE_LIMIT:-"0"}
      # التخزين الدائم: تثبيت مجلد البيانات يحفظ التجارب والمهام عبر إعادة النشر
      PHARMA_SDL_DATA_DIR: /app/data
      # ── P3: التخزين الحي — يُفعَّل تلقائياً حين تعمل خدمة postgres (ملف التعريف pg) ──
      PHARMA_SDL_STORE: ${PHARMA_SDL_STORE:-sqlite}
      PHARMA_SDL_PG_DSN: ${PHARMA_SDL_PG_DSN:-}
    volumes:
      - pharma-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: pharma-sdl:0.5.0
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma-local-change-me}
      POSTGRES_DB: pharma_sdl
    volumes:
      - pharma-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma_sdl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pharma-data:
  pharma-pg:
